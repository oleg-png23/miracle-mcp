<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>Solar Flare gradient glass</title>
<defs>
<filter id="glow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="90"/></filter>
<radialGradient id="fade"><stop offset="30%" stop-color="white" stop-opacity="0"/><stop offset="100%" stop-color="white" stop-opacity=".96"/></radialGradient>
<linearGradient id="rib"><stop stop-color="white" stop-opacity=".48"/><stop offset=".08" stop-color="white" stop-opacity=".02"/><stop offset=".92" stop-color="white" stop-opacity=".03"/><stop offset="1" stop-color="white" stop-opacity=".56"/></linearGradient>
<pattern id="ribs" width="126" height="1440" patternUnits="userSpaceOnUse"><rect width="126" height="1440" fill="url(#rib)"/><path d="M125 0v1440" stroke="white" stroke-opacity=".42" stroke-width="2"/></pattern>
</defs>
<rect width="2560" height="1440" fill="#FAFBF7"/>
<g filter="url(#glow)" opacity=".9">
<ellipse cx="1120" cy="610" rx="390" ry="460" fill="#FF5A1F"/>
<ellipse cx="1570" cy="550" rx="370" ry="370" fill="#FF2E63"/>
<ellipse cx="1340" cy="900" rx="340" ry="320" fill="#FFB020"/>
<ellipse cx="1830" cy="830" rx="280" ry="340" fill="#FF8A00"/>
</g>
<rect x="420" width="1850" height="1440" fill="url(#ribs)"/>
<rect width="2560" height="1440" fill="url(#fade)"/>
</svg>
